[project]
name = "clipforge"
version = "0.1.0"
description = "Local-first AI clipping platform: long videos to high-quality vertical shorts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "groq>=0.12",
    "yt-dlp>=2025.1.1",
    "ffmpeg-python>=0.2.0",
    "faster-whisper>=1.1",
    "mediapipe>=0.10",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "librosa>=0.10",
    "pillow>=11.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependency injection uses call expressions in defaults

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
